<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CREZE CAPTURES — Visual Direction & Post-Production</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg: #050507;
      --card-bg: rgba(14, 15, 20, 0.65);
      --card-glass: rgba(255, 255, 255, 0.025);
      --border: rgba(255, 255, 255, 0.07);
      --border-bright: rgba(255, 255, 255, 0.22);
      --text: #f4f4f6;
      --text-muted: #8b8f9e;
      --accent-silver: #e2e8f0;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.035) 0%, transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(255, 255, 255, 0.025) 0%, transparent 45%),
        linear-gradient(180deg, #050507 0%, #07070b 100%);
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Monochrome Glass Panel */
    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .glass:hover {
      border-color: var(--border-bright);
    }

    .glass::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .glass:hover::after {
      opacity: 1;
    }

    /* Micro Badges & Typo */
    .mono-tag {
      font-family: var(--font-display);
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-silver);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .mono-tag::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 18px;
      z-index: 100;
      margin-bottom: 50px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 26px;
    }

    .brand {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
    }
